name: Release distributions
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified tag artifacts through the configured PyPI trusted publisher
        type: boolean
        default: false
      qualification_run:
        description: Successful tag qualification run whose exact artifacts were independently checked
        type: string
        default: ""
      qualified_hashes:
        description: Space-separated sorted SHA256 values for the three qualified distributions
        type: string
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Display and distribution versions agree
        run: |
          python scripts/release_version.py
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CIBW_BUILD: cp312-manylinux_x86_64 cp312-win_amd64
      CIBW_ARCHS_LINUX: x86_64
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=2 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
      CIBW_TEST_REQUIRES: pytest==9.2.0 osqp==1.1.3 daqp==0.10.3 elastiqp==0.2.0 clarabel==0.11.1 proxsuite==0.7.2 piqp==0.6.4
      CIBW_TEST_COMMAND: >-
        python -c "print('CPU learning collection is excluded from hosted wheel smoke')"
        && python {project}/scripts/wheel_smoke.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist-${{ github.sha }}
          path: dist
      - run: python -m pip install cibuildwheel==4.3.5 twine==7.0.0
      - name: Build the single verified source archive
        run: |
          python -c "from pathlib import Path; import subprocess,sys; archives=list(Path('dist').glob('softqp-*.tar.gz')); assert len(archives)==1; subprocess.run([sys.executable,'-m','cibuildwheel','--output-dir','wheelhouse',str(archives[0])],check=True)"
      - run: python -m twine check wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}-${{ github.sha }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/softqp/
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install packaging
      - name: Require an explicit version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          python scripts/release_version.py --ref "$RELEASE_REF"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require successful qualification for this exact tag and workflow
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
          RELEASE_REF: ${{ github.ref }}
        shell: bash
        run: |
          [[ "$QUALIFICATION_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN" |
            jq -e --arg sha "$GITHUB_SHA" --arg tag "${RELEASE_REF#refs/tags/}" '
              .head_sha == $sha and .head_branch == $tag and
              .event == "workflow_dispatch" and .conclusion == "success" and
              .path == ".github/workflows/release.yml"'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run }}
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: dist
      - name: Verify reviewed distribution bytes
        env:
          QUALIFIED_HASHES: ${{ inputs.qualified_hashes }}
        run: |
          python - <<'PY'
          from hashlib import file_digest
          import os
          from pathlib import Path
          files = sorted(Path("dist").iterdir())
          assert len(files) == 3 and sum(p.suffix == ".whl" for p in files) == 2
          assert sum(p.name.endswith(".tar.gz") for p in files) == 1
          hashes = []
          for path in files:
              with path.open("rb") as handle:
                  hashes.append(file_digest(handle, "sha256").hexdigest())
          assert sorted(hashes) == os.environ["QUALIFIED_HASHES"].split()
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
