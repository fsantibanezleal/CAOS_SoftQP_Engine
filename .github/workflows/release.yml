name: Release distributions
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified tag artifacts through the configured PyPI trusted publisher
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-sdist-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CIBW_BUILD: cp312-manylinux_x86_64 cp312-win_amd64
      CIBW_ARCHS_LINUX: x86_64
      CIBW_ARCHS_WINDOWS: AMD64
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_ENVIRONMENT: CMAKE_BUILD_PARALLEL_LEVEL=2 OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
      CIBW_TEST_REQUIRES: pytest==9.2.0 osqp==1.1.3 daqp==0.10.3 elastiqp==0.2.0
      CIBW_TEST_COMMAND: python {project}/scripts/wheel_smoke.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-sdist-${{ github.sha }}
          path: dist
      - run: python -m pip install cibuildwheel==4.3.5 twine==7.0.0
      - run: python -m cibuildwheel --output-dir wheelhouse dist/softqp-0.1.0.tar.gz
      - run: python -m twine check wheelhouse/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ matrix.os }}-${{ github.sha }}
          path: wheelhouse/*.whl
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [source, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/softqp/
    permissions:
      id-token: write
    steps:
      - name: Require an explicit version tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/tags/v0.1.0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*-${{ github.sha }}
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
