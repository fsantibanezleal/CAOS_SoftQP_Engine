[build-system]
requires = ["setuptools>=77", "wheel", "cmake>=3.26", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "softqp"
version = "0.2.0"
description = "Native soft-constrained quadratic programs with inspectable penalty semantics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Felipe Santibáñez-Leal"}]
dependencies = ["numpy>=1.26", "scipy>=1.11", "jinja2>=3.1", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "osqp>=1.0"]
comparisons = ["daqp==0.10.3", "elastiqp==0.2.0"]

[project.urls]
Repository = "https://github.com/fsantibanezleal/CAOS_SoftQP_Engine"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
